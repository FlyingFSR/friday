name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    # mlx-swift 0.32.3 needs Swift tools 6.3, which macos-15 (Swift 6.1) lacks;
    # macos-26 defaults to Xcode 26.6. Tests need no model download and do not
    # run MLX on the GPU, so the Metal shader library is not fetched here.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: swift build --build-system native
      - name: Test
        run: swift test --build-system native
