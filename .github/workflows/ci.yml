name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    # macos-15 ships Xcode 16+, required for the Swift Testing framework
    # used by the test suite. Tests need no model download and do not run
    # MLX on the GPU, so the Metal shader library is not fetched here.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: swift build --build-system native
      - name: Test
        run: swift test --build-system native
